name: A2AClear Protocol CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography build
        cd python && pip install -e .

    - name: Run Bilateral Settlement Test
      run: |
        python python/examples/demo_bilateral_settlement.py

    - name: Run Fortress Defense & Ecosystem Test
      run: |
        python python/examples/demo_fortress_defense.py

    - name: Run Cybersecurity & Anti-Hacking Test
      run: |
        python python/examples/demo_security_and_antihack.py

    - name: Verify CLI Tool
      run: |
        a2a demo
